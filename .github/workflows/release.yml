# Builds Windows DLLs and attaches them to each GitHub release, which is how PIE installs an extension on Windows: it
# downloads a prebuilt DLL rather than building from source. Uses PHP's own php-windows-builder actions, following the
# template in their README.
#
# On Mac and Linux, PIE builds from source, so nothing is needed for those.
#
# It can also be run by hand (workflow_dispatch) to check the Windows builds without a release; the upload job only runs
# for a release.

name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-extension-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      # x64 only: 32-bit builds have never been tested.
      - id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@v1
        with:
          php-version-list: '8.4, 8.5'
          arch-list: 'x64'
          ts-list: 'nts, ts'

  build:
    needs: get-extension-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-extension-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-oceanmoon_math

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    steps:
      - uses: php/php-windows-builder/release@v1
        with:
          release: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
